name: Cast artwork

# Renders the landing mascots once on a GitHub runner (free image tier, own IP quota)
# and commits them to web/public/cast/. Re-runs only render members that are missing.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every member (true/false)"
        default: "false"
  push:
    paths:
      - "web/src/content/brand.ts"
      - "web/scripts/cast-art.mjs"
      - ".github/workflows/cast-art.yml"

permissions:
  contents: write

concurrency:
  group: cast-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render cast
        run: node web/scripts/cast-art.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit artwork
        run: |
          git config user.name "mascott-art-bot"
          git config user.email "mascott-art-bot@users.noreply.github.com"
          git add web/public/cast web/src/content/cast-art.json
          git diff --cached --quiet && exit 0
          git commit -m "Cast artwork for ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
