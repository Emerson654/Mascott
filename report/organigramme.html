<title>Organigramme Mascott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide org chart (scrolls sideways on phones) above a live activity list. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#1b2140; --muted:#5b6385; --line:#d6dcef;
  --accent:#3d5afe; --accent-soft:#e6eaff; --sun:#ffb020; --sun-soft:#fff3d6; --good:#1f8a5b;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152a; --surface:#1b1f3a; --ink:#eef0fb; --muted:#a3aad0; --line:#2e3460;
  --accent:#8c9dff; --accent-soft:#262d5c; --sun:#ffc24d; --sun-soft:#3a3320; --good:#5fd39c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --surface:#1b1f3a; --ink:#eef0fb; --muted:#a3aad0; --line:#2e3460;
  --accent:#8c9dff; --accent-soft:#262d5c; --sun:#ffc24d; --sun-soft:#3a3320; --good:#5fd39c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);padding-inline:16px;padding-block:24px 48px;margin:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--accent-soft);width:fit-content}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--good)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;overflow-x:auto}
svg{display:block;width:100%;min-width:900px;height:auto}
.wire{fill:none;stroke:var(--line);stroke-width:2}
.wire.on{stroke:var(--sun);stroke-width:3;stroke-dasharray:8 10;animation:flow .7s linear infinite}
.wire.back{stroke:var(--accent);stroke-width:3;stroke-dasharray:8 10;animation:flowback .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes flowback{to{stroke-dashoffset:18}}
.card rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.card.on rect{stroke:var(--sun);stroke-width:3;fill:var(--sun-soft)}
.card.back rect{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
.card .name{font-family:var(--f-display);font-weight:600;font-size:16px;fill:var(--ink)}
.card .role{font-size:11.5px;fill:var(--muted)}
.card .task{font-family:var(--f-mono);font-size:10px;fill:var(--ink)}
.pole{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:.88rem;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:0;border-top:3px dashed;margin-right:8px;vertical-align:middle}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.log li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.log b{font-family:var(--f-display);font-weight:600}
@media (prefers-reduced-motion:reduce){.wire.on,.wire.back{animation:none}}
</style>

<div class="wrap">
  <span class="status" id="status"><span class="dot"></span><span id="statusText">Connexion…</span></span>
  <h1>Organigramme Mascott</h1>
  <p class="sub">Qui travaille en ce moment. Quand Claude (CEO) confie une mission, le courant part vers l'employé concerné. Quand le CEO vérifie le travail rendu, il remonte vers lui.</p>
  <div class="board"><svg id="org" viewBox="0 0 1100 560" role="img" aria-label="Organigramme : Président, Claude (CEO), puis les pôles Marketing, Commercial et Développement"></svg></div>
  <div class="legend">
    <span><i style="border-color:var(--sun)"></i>Mission en cours (le courant descend)</span>
    <span><i style="border-color:var(--accent)"></i>Le CEO vérifie le travail (le courant remonte)</span>
    <span><i style="border-color:var(--line)"></i>Au repos</span>
  </div>
  <ul class="log" id="log"></ul>
</div>

<script>
(function(){
  var AG=[
    {id:"marketing-brand",name:"Léa",role:"Marque & DA",pole:0},
    {id:"marketing-cro",name:"Hugo",role:"CRO",pole:0},
    {id:"marketing-pricing",name:"Inès",role:"Prix & Stripe",pole:0},
    {id:"marketing-communication",name:"Nora",role:"Communication",pole:0},
    {id:"sales",name:"Malik",role:"Prospection",pole:1},
    {id:"dev-frontend",name:"Chloé",role:"Front-end",pole:2},
    {id:"dev-backend",name:"Yanis",role:"Back-end",pole:2},
    {id:"dev-mascot-engine",name:"Sacha",role:"Moteur mascotte",pole:2},
    {id:"dev-seo-geo",name:"Camille",role:"SEO / GEO",pole:2},
    {id:"dev-security",name:"Victor",role:"Cybersécurité",pole:2}
  ];
  var POLES=["Marketing","Commercial","Développement"];
  var W=1100,cw=98,ch=74,y=430,gap=8;
  var xs=[],x=20;
  AG.forEach(function(a,i){ if(i>0 && AG[i-1].pole!==a.pole) x+=36; xs.push(x); x+=cw+gap; });
  var off=(W-(x-gap)-20)/2; xs=xs.map(function(v){return v+off;});
  var state={};

  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function short(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s;}

  function render(){
    var any=false,anyBack=false,o="";
    var cx=W/2;
    AG.forEach(function(a,i){
      var st=(state[a.id]||{}).state||"idle"; if(st==="working")any=true; if(st==="testing")anyBack=true;
      var ax=xs[i]+cw/2, cls=st==="working"?"on":(st==="testing"?"back":"");
      o+='<path class="wire '+cls+'" d="M'+cx+',236 C'+cx+',330 '+ax+',320 '+ax+','+y+'"/>';
    });
    var top=any?"on":(anyBack?"back":"");
    o+='<path class="wire '+top+'" d="M'+cx+',96 L'+cx+',160"/>';
    POLES.forEach(function(p,k){
      var idx=AG.map(function(a,i){return a.pole===k?i:-1;}).filter(function(i){return i>=0;});
      var mid=(xs[idx[0]]+xs[idx[idx.length-1]]+cw)/2;
      o+='<text class="pole" x="'+mid+'" y="'+(y-14)+'" text-anchor="middle">'+p+'</text>';
    });
    function card(x0,y0,w,h,name,role,task,cls){
      var t='<g class="card '+(cls||"")+'"><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="14"/>';
      t+='<text class="name" x="'+(x0+w/2)+'" y="'+(y0+28)+'" text-anchor="middle">'+esc(name)+'</text>';
      t+='<text class="role" x="'+(x0+w/2)+'" y="'+(y0+46)+'" text-anchor="middle">'+esc(role)+'</text>';
      if(task)t+='<text class="task" x="'+(x0+w/2)+'" y="'+(y0+63)+'" text-anchor="middle">'+esc(short(task,16))+'</text>';
      return t+'</g>';
    }
    o+=card(cx-90,24,180,72,"Toi","Président","",top);
    o+=card(cx-100,160,200,76,"Claude","CEO",(state.ceo||{}).task||"",(any||anyBack)?(anyBack?"back":"on"):"");
    AG.forEach(function(a,i){
      var s=state[a.id]||{};
      o+=card(xs[i],y,cw,ch+12,a.name,a.role,s.state==="idle"?"":s.task,s.state==="working"?"on":(s.state==="testing"?"back":""));
    });
    document.getElementById("org").innerHTML=o;

    var active=AG.filter(function(a){var s=(state[a.id]||{}).state;return s==="working"||s==="testing";});
    document.getElementById("log").innerHTML=active.length?active.map(function(a){var s=state[a.id];
      return '<li><b>'+esc(a.name)+'</b> ('+esc(a.role)+') · '+(s.state==="testing"?"le CEO vérifie : ":"travaille sur : ")+esc(s.task||"mission en cours")+'</li>';}).join(""):'<li>Personne ne travaille en ce moment. Toute l’équipe attend la prochaine mission du Président.</li>';
  }
  render();

  function setStatus(t,live){document.getElementById("statusText").textContent=t;document.getElementById("status").classList.toggle("live",!!live);}
  setStatus("Connexion…");
  var c=window.claude;
  if(!c||!c.use){setStatus("Mode aperçu : état en direct indisponible");return;}
  c.use("db").then(function(db){
    if(!db){setStatus("État en direct indisponible (connecte-toi à claude.ai)");return;}
    db.doc("org/status").onSnapshot(function(snap){
      state=(snap.exists&&snap.data())||{};
      setStatus("En direct",true); render();
    },function(){setStatus("Connexion perdue, nouvelle tentative…");});
  });
})();
</script>
